<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Healthcare Monitoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-image: linear-gradient(rgba(0, 60, 80, 0.55), rgba(0, 40, 60, 0.65)), url("/static/images/main1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            color: white;
            font-weight: 500;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .container {
    background: rgba(255, 255, 255, 0.14);
    padding: 3rem;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    max-width: 600px;
    width: 90%;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    text-align: center;
}


        .container:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .btn-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .btn {
    background: rgba(0, 180, 220, 0.9);
    color: white;
    padding: 13px 25px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: 0.3s ease-in-out;
    display: inline-block;
    min-width: 160px;
    text-align: center;
}

.btn:hover {
    background: rgba(0, 220, 240, 1);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

        .top-right-button {
            background: #4caf50;
            border: none;
            padding: 12px 24px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
            min-width: 150px;
        }

        .top-right-button:hover {
            background: #388e3c;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(56, 142, 60, 0.4);
        }

        /* Subtle floating animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .container {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <a href="javascript:history.back()" class="back-btn">← Back</a>
    <div class="container">
        <h2>Automated Healthcare Monitoring</h2>
        <p>Track and manage healthcare attendance with ease using our advanced detection system.</p>
        <div class="btn-container">
            <form id="detectForm" action="/detect" method="post">
                <button type="submit" class="btn" id="detectBtn">Start Detection</button>
            </form>
            <a href="/attendance" class="btn">View Attendance</a>
            <a href="/ai-assistant" class="btn">AI Assistant</a>
            <a href="/submit_update" class="btn">PHC Monitoring</a>
        </div>
    </div>

    <script>
        // FIX: "Location: Unknown" bug. The server's current_location only
        // updates once the browser POSTs real coordinates to
        // /update-location. Previously this only happened (maybe) on the
        // index.html page load, with no guarantee it finished before you
        // clicked "Start Detection" here on view.html - so /detect usually
        // ran against a stale/empty "Unknown" location.
        //
        // Now: clicking "Start Detection" first asks for your location,
        // waits for /update-location to actually complete, and only then
        // submits the /detect form - so the location used for this
        // detection run is guaranteed fresh.
        document.getElementById('detectForm').addEventListener('submit', function (event) {
            const btn = document.getElementById('detectBtn');

            if (!navigator.geolocation) {
                return; // no geolocation support - let it submit as-is
            }

            event.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Getting location...';

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    fetch('/update-location', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        })
                    })
                    .catch(function () { /* fall through and detect anyway */ })
                    .finally(function () {
                        btn.textContent = 'Start Detection';
                        document.getElementById('detectForm').submit();
                    });
                },
                function () {
                    // Permission denied / unavailable - proceed anyway,
                    // location will just show "Unknown" for this run.
                    btn.textContent = 'Start Detection';
                    document.getElementById('detectForm').submit();
                },
                { timeout: 5000 }
            );
        });
    </script>
</body>
</html>
