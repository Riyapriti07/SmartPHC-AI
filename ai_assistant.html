<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPHC AI Assistant</title>
   
<style>
    /* ===== BACKGROUND: replace this block with the View Attendance page background ===== */
    :root { --page-bg: linear-gradient(135deg, #0f4c5c 0%, #176b87 45%, #5f0f40 100%); }
    /* ================================================================================== */
     /* ===== BACKGROUND: same as View Attendance page ===== */
    :root { --page-bg: linear-gradient(rgba(0, 60, 80, 0.60), rgba(0, 40, 60, 0.70)),
                       url("/static/images/main1.jpg") center / cover no-repeat; }
    /* ==================================================== */
    :root { --accent: #1e90ff; --accent2: #7b4ae2; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0; font-family: "Segoe UI", Arial, sans-serif;
        background: var(--page-bg); background-size: cover; background-attachment: fixed;
        display: flex; flex-direction: column;
    }
    .header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 28px; color: #fff;
        background: rgba(0,0,0,.25); backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
        width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
        background: linear-gradient(135deg, #22d3a6, var(--accent2)); font-size: 22px;
    }
    .brand h2 { margin: 0; font-size: 19px; }
    .brand small { opacity: .8; }
    .links a, .links button {
        color: #fff; text-decoration: none; font-size: 14px; margin-left: 10px;
        background: rgba(255,255,255,.15); border: 0; padding: 8px 14px;
        border-radius: 20px; cursor: pointer;
    }
    .links a:hover, .links button:hover { background: rgba(255,255,255,.28); }

    .wrap { flex: 1; width: 100%; max-width: 900px; margin: 0 auto; padding: 20px;
            display: flex; flex-direction: column; min-height: 0; }
    .card {
        flex: 1; min-height: 0; display: flex; flex-direction: column;
        background: rgba(255,255,255,.94); border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,.3); overflow: hidden;
    }
    .chat { flex: 1; overflow-y: auto; padding: 22px; scroll-behavior: smooth; }
    .row { display: flex; gap: 10px; margin: 14px 0; align-items: flex-end; animation: pop .25s ease; }
    .row.user { flex-direction: row-reverse; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .avatar {
        width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid;
        place-items: center; font-size: 18px; color: #fff;
    }
    .bot .avatar { background: linear-gradient(135deg, #22d3a6, var(--accent)); }
    .user .avatar { background: linear-gradient(135deg, #ff8a5c, #ef476f); font-size: 14px; font-weight: 700; }
    .bubble {
        max-width: 78%; padding: 12px 16px; line-height: 1.55; font-size: 15px;
        white-space: pre-wrap; overflow-wrap: anywhere;
        box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .bot .bubble { background: #eef6f9; color: #17323f; border-radius: 18px 18px 18px 4px; }
    .user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
                    border-radius: 18px 18px 4px 18px; }
    .error .bubble { background: #fdecec; color: #8a1c1c; }
    .excerpt { font-size: 13px; background: #fff7e6; border-left: 3px solid #f0a500;
               padding: 6px 8px; margin-top: 8px; border-radius: 4px; }
    .excerpt-title { font-size: 12px; color: #5b6b7c; margin-top: 10px; }

    .typing span { display: inline-block; width: 8px; height: 8px; margin: 0 2px;
                   background: #7aa7b6; border-radius: 50%; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.1); } }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 12px; }
    .chip {
        background: #fff; color: var(--accent); border: 1px solid #b9dbe6; border-radius: 20px;
        padding: 7px 14px; font-size: 13px; cursor: pointer; transition: .15s;
    }
    .chip:hover { background: var(--accent); color: #fff; }

    .input-area { display: flex; gap: 10px; align-items: flex-end; padding: 14px 18px;
                  background: #fff; border-top: 1px solid #e3edf1; }
    #question {
        flex: 1; resize: none; max-height: 130px; padding: 13px 16px; font: inherit; font-size: 15px;
        border: 1.5px solid #cfdde3; border-radius: 22px; outline: none; transition: .15s;
    }
    #question:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(123,74,226,.15); }
    #sendButton {
        width: 46px; height: 46px; border: 0; border-radius: 50%; cursor: pointer; flex: none;
        color: #fff; font-size: 20px; background: linear-gradient(135deg, var(--accent), var(--accent2));
        transition: transform .15s;
    }
    #sendButton:hover:not(:disabled) { transform: scale(1.08); }
    #sendButton:disabled { opacity: .5; cursor: not-allowed; }
    .note { color: rgba(255,255,255,.8); font-size: 12px; text-align: center; margin: 10px 0 0; }
    .note a { color: #fff; }
    @media (max-width: 600px) {
        .wrap { padding: 10px; } .bubble { max-width: 88%; } .brand small { display: none; }
    }
</style>
</head>
<body>

<div class="header">
    <div class="brand">
        <div class="logo">🩺</div>
        <div><h2>SmartPHC AI Assistant</h2><small>Ask about your PHCs, attendance and documents</small></div>
    </div>
    <div class="links">
        <button type="button" id="clearBtn">New chat</button>
        <a href="/upload-documents">Upload documents</a>
    </div>
</div>

<div class="wrap">
    <div class="card">
        <div class="chat" id="chatBox"></div>
        <div class="chips" id="chips">
            <button type="button" class="chip">Is Government PHC Karur unusual this week?</button>
            <button type="button" class="chip">Which doctors are absent today?</button>
            <button type="button" class="chip">What are the most common diagnoses?</button>
            <button type="button" class="chip">What does the guideline say about immunization?</button>
        </div>
        <form class="input-area" id="chatForm">
            <textarea id="question" rows="1" placeholder="Message SmartPHC Assistant..." required></textarea>
            <button type="submit" id="sendButton" title="Send">➤</button>
        </form>
    </div>
    <p class="note">Patient names and phone numbers are never sent to the AI.</p>
</div>

<script>
    const chatForm = document.getElementById("chatForm");
    const questionInput = document.getElementById("question");
    const chatBox = document.getElementById("chatBox");
    const sendButton = document.getElementById("sendButton");
    const chips = document.getElementById("chips");

    function addRow(sender, extraClass) {
        const row = document.createElement("div");
        row.className = "row " + sender + (extraClass ? " " + extraClass : "");
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = sender === "bot" ? "🤖" : "You";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        row.appendChild(avatar);
        row.appendChild(bubble);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        return { row: row, bubble: bubble };
    }

    function addMessage(text, sender, excerpts, isError) {
        const r = addRow(sender, isError ? "error" : "");
        r.bubble.textContent = text;   // textContent: never treated as HTML
        if (excerpts && excerpts.length) {
            const t = document.createElement("div");
            t.className = "excerpt-title";
            t.textContent = "Related document excerpts (not an AI answer):";
            r.bubble.appendChild(t);
            excerpts.forEach(function (e) {
                const x = document.createElement("div");
                x.className = "excerpt";
                x.textContent = e.source + ": " + e.text;
                r.bubble.appendChild(x);
            });
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function welcome() {
        chatBox.innerHTML = "";
        addMessage("Hello! 👋 I'm the SmartPHC Assistant. Ask me about your PHCs, " +
                   "today's attendance, diagnoses or your uploaded documents.", "bot");
        chips.style.display = "flex";
    }

    async function send(question) {
        question = question.trim();
        if (!question) return;
        chips.style.display = "none";
        addMessage(question, "user");
        questionInput.value = "";
        questionInput.style.height = "auto";
        sendButton.disabled = true;

        const typing = addRow("bot");
        typing.bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

        try {
            const response = await fetch("/ask-ai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();
            typing.row.remove();
            if (!response.ok) {
                addMessage("AI unavailable: " + (data.error || "Request failed."),
                           "bot", data.excerpts, true);
            } else {
                addMessage(data.answer, "bot");
            }
        } catch (error) {
            typing.row.remove();
            addMessage("Sorry, something went wrong: " + error.message, "bot", null, true);
        }
        sendButton.disabled = false;
        questionInput.focus();
    }

    chatForm.addEventListener("submit", function (e) { e.preventDefault(); send(questionInput.value); });
    questionInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); }
    });
    questionInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 130) + "px";
    });
    chips.addEventListener("click", function (e) {
        if (e.target.classList.contains("chip")) send(e.target.textContent);
    });
    document.getElementById("clearBtn").addEventListener("click", welcome);
    welcome();
</script>
</body>
</html>
